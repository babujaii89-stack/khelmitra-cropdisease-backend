services:
  - type: web
    name: khetmitra-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: DATA_GOV_IN_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
